services:
  server:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    ports:
      - "8402:8402"
    env_file:
      - .env
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
