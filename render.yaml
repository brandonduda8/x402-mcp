services:
  - type: web
    name: x402-mission-control
    env: python
    buildCommand: "cd dashboard && pnpm install && pnpm build && cd .. && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 20.0.0
      - key: PUBLIC_BASE_URL
        sync: false # Set to https://your-app.onrender.com after deployment
      - key: X402_PAY_TO_ADDRESS
        sync: false # Set to your recipient EVM wallet address
      - key: SWARM_ENABLED
        value: "true"
